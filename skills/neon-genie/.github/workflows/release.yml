name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only (do not create GitHub release)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve version / tag
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Pre-release gate
        run: python scripts/release_check.py --tag "${{ steps.meta.outputs.tag }}"

      - name: Full packaging smoke
        run: |
          python scripts/neon_genie.py do check
          python scripts/test_hermes_frontmatter.py
          python scripts/neon_genie.py do dist verify
          python scripts/test_run_envelope.py
          python scripts/test_operator_surface.py
          python scripts/test_route_profiles.py
          python scripts/test_learning_reconcile.py
          python scripts/test_distribution_spine.py
          python scripts/neon_genie.py do eval
          python scripts/neon_genie.py do behavioral --suite
          python scripts/neon_genie.py do recipe --name product-audit --out out/neon-genie/release-smoke
          python scripts/neon_genie.py do validate --packet out/neon-genie/release-smoke/run-envelope.json --type envelope --strict-authority

      - name: Build package artifact
        run: |
          mkdir -p dist
          tar -czf "dist/neon-genie-${{ steps.meta.outputs.version }}.tar.gz" \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='out' \
            -C skills neon-genie
          (
            cd dist
            sha256sum "neon-genie-${{ steps.meta.outputs.version }}.tar.gz" \
              > "neon-genie-${{ steps.meta.outputs.version }}.sha256"
          )
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neon-genie-${{ steps.meta.outputs.version }}
          path: dist/*

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          python - <<'PY' > /tmp/release-notes.md
          from pathlib import Path
          import re, os
          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pat = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## |\Z)"
          m = re.search(pat, text, re.S)
          body = m.group(1).strip() if m else f"Release {version}"
          print(f"## Neon Genie v{version}\n")
          print(body)
          print("\n### Install\n")
          print("```bash")
          print("hermes skills install scrimshawlife-ctrl/NeonGenie/skills/neon-genie")
          print("```")
          print("\n### Package\n")
          print(f"Attached: `neon-genie-{version}.tar.gz` + sha256.")
          PY

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets only"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "v${VERSION}" \
              --notes-file /tmp/release-notes.md
          fi
