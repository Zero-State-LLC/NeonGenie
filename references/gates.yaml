# Neon Genie — canonical gate registry (documentation + tooling)
# Behavioral fixtures and SKILL.md should stay aligned with these ids.
# Auto-generation of evaluators is not required; this is the ontology.

schema_version: 1
skill: neon-genie

gates:
  P:
    name: public_gap_research
    severity: blocking
    condition: public_gap && tools_available && !research_attempted
    remediation: perform_research_or_record_unavailability
    refs:
      - SKILL.md
      - evals/cases/public-gap-must-attempt-research.json
      - evals/behavioral/cases/public-market-research.json

  Q:
    name: private_gap_data_request
    severity: blocking
    condition: private_decision_critical_gap && !data_request
    remediation: emit_data_request
    refs:
      - SKILL.md
      - evals/cases/private-gap-must-request.json
      - evals/behavioral/cases/private-buyer-datarequest.json

  R:
    name: no_silent_observed_from_prior
    severity: blocking
    condition: private_or_unknown_fact_labeled_observed_from_model_prior
    remediation: relabel_or_request_source
    refs:
      - SKILL.md
      - evals/cases/offline-no-fabricated-observed.json

  D:
    name: memetic_cannot_raise_promotion
    severity: blocking
    condition: memetic_strength && evidence_or_feasibility_fail
    remediation: keep_promotion_capped
    refs:
      - SKILL.md
      - evals/cases/memetic-cannot-promote.json
      - evals/behavioral/cases/memetic-weak-proof.json

  G:
    name: completion_proof_or_no_fiction
    severity: blocking
    condition: promotion_testable_plus_without_completion_proof || fictional_resource
    remediation: add_proof_or_mark_not_computable
    refs:
      - SKILL.md
      - evals/cases/completion-proof-required.json
      - evals/cases/fictional-resource.json

  C:
    name: buyer_beneficiary_separation
    severity: blocking
    condition: buyer_roles_collapsed_without_evidence
    remediation: separate_roles_or_request_data
    refs:
      - SKILL.md
      - evals/cases/buyer-beneficiary-conflation.json

  B:
    name: no_forecast_as_fact
    severity: blocking
    condition: forecast_or_price_claimed_as_observed_without_source
    remediation: relabel_speculative_or_cite
    refs:
      - SKILL.md

  AUTHORITY:
    name: advisory_boundary
    severity: blocking
    forbidden_actions:
      - spend
      - submit
      - contact
      - publish
      - mutate_repository
      - execute_irreversible
    remediation: keep_advisory_only_and_handoff
    refs:
      - SKILL.md
      - docs/adr/0001-advisory-only-authority.md
      - evals/behavioral/cases/repo-mutation-advisory-only.json

  WAYFINDER:
    name: product_intent_change_control
    severity: blocking
    condition: handoff_without_product_intent_changes_require_neon_genie_review
    remediation: set_flag_true_on_wayfinder_packet
    refs:
      - docs/adr/0004-neon-genie-wayfinder-boundary.md
      - evals/behavioral/cases/wayfinder-change-control.json

  # Privacy-by-construction (S–Y). CLEAR order: authority → evidence P–R → privacy S–Y → rest.
  S:
    name: egress_destination_known
    severity: blocking
    condition: external_action_sent_true && (destination_unknown || destination_empty)
    remediation: block_send_and_log_BLOCK
    refs:
      - SKILL.md
      - profiles/privacy.md
      - references/PRIVACY.md
      - docs/adr/0006-privacy-by-construction.md

  T:
    name: offline_no_external_send
    severity: blocking
    condition: (privacy_mode_LOCAL_ONLY || research_disabled) && external_action_sent_true
    remediation: fail_CLEAR_and_correct_mode_or_actions
    refs:
      - SKILL.md
      - profiles/privacy.md
      - references/PRIVACY.md

  U:
    name: secret_no_egress
    severity: blocking
    condition: credential_or_secret_like_payload_would_be_or_was_sent
    remediation: BLOCK_never_OBSERVED_from_leaked_secret
    refs:
      - SKILL.md
      - profiles/privacy.md
      - scripts/privacy_preflight.py
      - references/PRIVACY.md

  V:
    name: private_egress_needs_consent
    severity: blocking
    condition: private_or_operator_egress_without_consent_ref
    remediation: REQUEST_CONSENT_or_keep_local
    refs:
      - SKILL.md
      - profiles/privacy.md
      - references/PRIVACY.md

  W:
    name: privacy_claim_must_be_supported
    severity: blocking
    condition: absolute_privacy_claim_without_matching_mode_and_evidence
    remediation: NOT_COMPUTABLE_or_privacy_warning
    refs:
      - SKILL.md
      - profiles/privacy.md
      - references/PRIVACY.md
      - docs/adr/0006-privacy-by-construction.md

  X:
    name: telemetry_off_unless_opt_in
    severity: blocking
    condition: telemetry_status_not_disabled
    remediation: force_disabled_and_fail_validate
    refs:
      - SKILL.md
      - profiles/privacy.md
      - references/PRIVACY.md

  Y:
    name: sealed_receipt_privacy_complete
    severity: blocking
    condition: SEAL_without_required_privacy_provenance_fields
    remediation: complete_receipt_before_SEAL
    refs:
      - SKILL.md
      - profiles/privacy.md
      - schemas/run-receipt.schema.json
      - references/PRIVACY.md

  # Doctrine 2026-09-05 (arXiv keepers / Boof P0). Schema fields pending accepted intent.
  LOGIC:
    name: dual_logic_label_required
    severity: blocking
    condition: opportunity_or_product_or_zero_option_run && logic_label_missing_or_invalid
    remediation: emit_effectual_or_causal_or_mixed_with_matching_CLEAR_inputs
    refs:
      - profiles/opportunity_mining.md
      - profiles/product_architecture.md
      - profiles/zero_option.md
      - /workspace/neon-genie-adapt/arxiv/UPGRADE-BRIEF.md
      - arXiv:2103.07999
      - arXiv:1711.07045

  STAGE:
    name: stage_vocab_and_scale_gate
    severity: blocking
    condition: (scale_without_test_evidence) || (opportunity_or_agentic_run && stage_missing)
    remediation: set_shape_test_or_scale_and_block_scale_without_test
    refs:
      - profiles/opportunity_mining.md
      - profiles/agentic_services.md
      - profiles/core.md
      - arXiv:2511.09533

  BRIC:
    name: bricolage_before_buy_build
    severity: blocking
    condition: proposed_spend_or_buy_or_build_without_repertoire_inventory || means_inventory_empty_on_effectual_or_zero_option
    remediation: inventory_declared_means_or_NOT_COMPUTABLE_plus_DataRequest
    refs:
      - profiles/zero_option.md
      - profiles/capital_sprint.md
      - arXiv:2108.09943
      - arXiv:2507.02819

  CITE:
    name: never_generate_citations
    severity: blocking
    condition: arxiv_doi_or_paper_claim_without_verified_fetch_or_operator_source
    remediation: drop_cite_or_fetch_then_cite_only_verified_ids
    refs:
      - profiles/evidence_intelligence.md
      - profiles/core.md
      - references/anti-overclaim-patterns.md
      - arXiv:2605.14306

  # Reconcile 2026-09-05 — prose-only (schema HOLD)
  HYP:
    name: hypothesis_mvp_map_before_testable
    severity: blocking
    condition: promotion_gte_testable && hypothesis_mvp_map_missing
    remediation: emit_falsifiable_hypothesis_mvp_and_kill_criteria
    refs:
      - profiles/opportunity_mining.md
      - profiles/product_architecture.md
      - arXiv:1808.05630
      - arXiv:2506.16334
    note: Distinct from Gate H / WAYFINDER (intent-rewrite handoff).

  METRIC:
    name: metric_roles_and_guardrail
    severity: blocking
    condition: decision_critical_metric_without_role || guardrail_breached
    remediation: label_success_guardrail_deterioration_or_quality_and_block_on_guardrail
    refs:
      - profiles/commercial.md
      - profiles/evidence_intelligence.md
      - arXiv:2402.11609
      - arXiv:2210.17187

  # Continue 2026-09-05 — prose-only (schema HOLD)
  LIVE:
    name: offline_causal_before_live_test
    severity: blocking
    condition: live_ab_or_pricing_rec_without_offline_pass_and_without_human_yes || significance_claimed_observed_without_source
    remediation: require_offline_logged_causal_pass_or_human_yes_keep_recommended_test_n_speculative
    refs:
      - profiles/evidence_intelligence.md
      - profiles/commercial.md
      - profiles/capital_sprint.md
      - arXiv:2001.05699
      - arXiv:1710.03410
      - arXiv:1811.00457

  CSET:
    name: competitor_set_before_share_claims
    severity: blocking
    condition: market_share_or_competitive_observed_without_competitor_set_definition || missing_metric_definition
    remediation: emit_competitor_set_definition_DataRequest_when_blocks_promotion_or_relabel
    refs:
      - profiles/opportunity_mining.md
      - profiles/commercial.md
      - profiles/fragmentation.md
      - arXiv:2212.04810
      - arXiv:2401.17448

  # U4 EviGraph — prose scaffolding (intent DRAFT; no SKILL/schema rewrite yet)
  LEDGER:
    name: claim_graph_ledger_cite_required
    severity: blocking
    condition: material_claim_without_active_ledger_cite || invent_observed_from_model_prior_without_ledger || unresolved_contradict_at_testable
    remediation: emit_ledger_cite_with_typed_relation_or_relabel_or_block_promotion
    refs:
      - profiles/evidence_intelligence.md
      - profiles/core.md
      - intent/2026-09-05-evigraph-ledger.md
      - arXiv:2606.04990
      - arXiv:2608.04738
      - arXiv:2607.28374
    note: Intent ACCEPTED 2026-09-05; schemas/evidence-ledger.schema.json optional in 3.26.x (warn-then-require). Relation enum Support|Depend-on|Contradict|Invalidate|Update.

  # PR-A 2026-09-05 — validation_isolation (P2-1)
  ISO:
    name: validation_isolation_before_irreversible
    severity: blocking
    condition: irreversible_action_and_not_(independent_and_versioned_log_pointer)
    remediation: emit_independent_true_and_log_pointer_plus_validation_log_version
    refs:
      - profiles/wayfinder_handoff.md
      - profiles/agentic_services.md
      - schemas/wayfinder-execution-packet.schema.json
      - intent/2026-09-05-validation-isolation.md
      - arXiv:2503.11951
      - arXiv:2511.03094
    note: Conjunction independent ∧ versioned log pointer when irreversible. Independence = boolean attestation (SHADOW, no proof). Alias table in profiles/wayfinder_handoff.md. PROMETHEUS consumes; no Wayfinder/fifth bot.

  # PR-B 2026-09-05 — U7 PaperPilot search DAG
  PILOT:
    name: research_search_dag_when_research_runs
    severity: blocking
    condition: research_ran_without_search_dag || empty_dag_stages_when_research_ran
    remediation: emit_research_search_dag_keyword_cite_expand_filter_score_extract
    refs:
      - profiles/evidence_intelligence.md
      - schemas/research-search-dag.schema.json
      - intent/2026-09-05-paperpilot-search-dag.md
      - arXiv:2607.00597
      - arXiv:2605.14306
    note: Warn-then-require in 3.26.x. Fabricated cites remain Gate CITE. No invent Brier.

